[lucidlint."pipeline/chain.py"]
ignore = ["unused"]

[lucidlint."pipeline/evals/eval_scoring.py"]
ignore = ["unused"]

# long-param-list: the sync seams are signature-bound (the server and the
# tests pin them); the per-site whys were the same policy, stated once.
[lucidlint."pipeline/api/sync.py"]
ignore = ["long-param-list"]

# long-param-list: the crop-grid run's inputs are the page's state — no
# class for one call site (two sites, one why).
[lucidlint."pipeline/evals/eval_crop_grid.py"]
ignore = ["long-param-list", "data-clump"]

# latent-class: the GEDCOM serializer: one concern, one state; its methods are the export's steps, no field-disjoint partition (recorded 2026-10-08, held not split)
[lucidlint."tools/gedcom_document.py"]
ignore = ["god-class", "long-param-list", "partition"]

# latent-class: the band-size sweep's locals carry the run's state — no class for one call site (recorded 2026-10-08, held not split)
[lucidlint."pipeline/evals/eval_band_size.py"]
ignore = ["god-class"]

# feature-envy: the page save is the page transaction's own step — it puts the
# reading blob, appends the one page event and writes the projection through
# the change, and the change is that write seam, not a second owner. Moving the
# step onto Change would put the page's row mapping in the transaction object.
[lucidlint."loft/live/pages.py"]
ignore = ["feature-envy"]

# latent-class: LiveStore is the one public facade TECHSPEC/08 §19.3 names —
# the read half (events_for, verify_chain, rebuild_*) and the write half
# (change, connection) are one seam by design; splitting it would move the
# store's API between two objects and break the "one facade" rule.
[lucidlint."loft/live/store.py"]
ignore = ["partition"]
