# lucidlint configuration — see docs/PLAN/lucidlint-review-log.md for the
# full reasoning behind every scoped ignore. Each entry is acknowledged debt
# where the tool's rule collides with the repo's coding standards (recorded
# 2026-08-16, first full-repo run).

[lucidlint]
# record-shape: the family is FIXED IN CODE (2026-10-17) — every record is a
# class in a file named after it, owning its wire format; `document/schemas.py`
# (a TypedDict bag) is dissolved and ~150 record modules landed. What the rule
# still reports is a TOOL BUG: it fires on the very pattern its own message
# prescribes — `from_dict(cls, raw: dict[str, Any])`, `to_dict(self) ->
# dict[str, Any]`, and the constant-key literal that method builds (the
# serialization edge, where a bare dict is correct). The minimal repro and the
# reasoning: docs/PLAN/lucidlint-review-log.md §1.5 and §2.2. The rule stays
# ignored so the gate's verdict is not polluted by the tool's own bug; a NEW
# bare dict for a record is still a finding at review.
# global-state: the repo standard REQUIRES named constants and forbids the
# thing this rule should catch — module-level mutable state. On 0.7.1 the rule
# flags every module-level constant (348 on this tree); the repo's answer is
# the rule's own: the value goes on the class that owns the work, privately
# unless another module reads it. The constants sweep moved all 348; the rule
# stays ON so a new module-level value fails the gate. The tool-behaviour note
# (its message permits a constant its own finding still reports) stays in
# docs/PLAN/lucidlint-review-log.md §1.6.
#
# duplicate-module: the rule compares structural skeletons with identifiers
# erased, so distinct records that share a shape — `{"error"}` vs `{"note"}`,
# `x, y` vs `start, end` — read as forks (31 findings). The repo's record
# doctrine deliberately produces such small records; the one byte-identical
# family (five tool-argument records) was deduplicated into PersonIdArgs and
# SearchQueryArgs, which the rule still reports against each other. The
# reasoning: docs/PLAN/lucidlint-review-log.md §1.7. A real fork is still a
# review finding.
ignore = [
    "record-shape",
    "class-module",
    "vague-name",
    "magic-number",
    "duplicate-module",
]
# noqa: no longer ignored (2026-10-17) — every `# noqa` site now carries its
# why in the tool's format (`# noqa: F401 — the architecture test's
# store-layer marker`), and the six stale `# noqa: E501` markers are deleted
# (those lines are inside the limit; ruff never fired on them). The rule
# stays on so a new bare marker fails the gate.
# class-module: every flagged module is named after its domain noun and
# holds the noun's exception or helper class (htr.py/HtrError, sync.py/
# Outbox, review.py/_Chat) — one reason to change, the standards' stated
# exception to "each class in its own module".
# vague-name: "Store" is a sanctioned domain noun in coding-standards.md
# ("plus Store, Records, Projection, AiClient") — the tool's vague-name
# list collides with the house vocabulary.

# fakefs: the repo's testing standards permit deterministic real-FS tests
# (tmp_path) — the archive/store tests need real os.replace/subprocess/
# sqlite semantics that pyfakefs cannot fake faithfully; the private
# dataset checks must read the real repo tree. Suppressed at the tests
# scope with the standards' citation.

# unused in the eval modules: their entry points (run_flow, condition_*,
# load_projection) exist to be driven by tests/test_evals.py — the module
# IS the eval harness, so cross-file-reference counting is structurally
# inapplicable. (Tool bug: a per-function `ignore unused` comment counts as
# a reference, so the finding stops firing AND the suppression is reported
# stale — see docs/PLAN/lucidlint-review-log.md §1.5.)
[lucidlint."tools/eval_memory.py"]
ignore = ["unused", "duplicate"]
[lucidlint."tools/eval_review.py"]
ignore = ["unused"]

# lucidlint-dist: the vendored release bundle the make target downloads
# (gitignored — the repo's own code never lives there). Its findings are
# the tool reviewing itself; the next download overwrites any edit, and
# the make target verifies the SHA256SUMS, so the bundle is immutable
# input, not repo code (2026-08-29).
[lucidlint."**/lucidlint.json"]
ignore = ["standard"]  # the acknowledged-debt list is data the gate feeds on, not source


[lucidlint."tests/**"]
ignore = ["fakefs"]

[lucidlint."tests/pipeline/**"]
ignore = ["fakefs"]

[lucidlint."tests/document/**"]
ignore = ["fakefs"]

# unused: the repo's tests drive the modules' entry points directly (the DI
# convention — run_review_gate(fetch, …), the seam wrappers, the eval harnesses,
# the detecursor helpers) — a PRODUCTION-only reference count cannot see the
# test suite, so the family misfires on every deliberate seam. The coding
# standards name the convention; the eval-module exclusion extends to the
# modules whose public faces exist for the tests to drive (2026-10-08).
[lucidlint."pipeline/detect/reader.py"]
ignore = ["unused", "god-class", "partition"]
[lucidlint."pipeline/detect/ink.py"]
ignore = ["unused"]
[lucidlint."pipeline/detect/mark.py"]
ignore = ["unused"]
[lucidlint."pipeline/detect/box.py"]
ignore = ["unused"]
[lucidlint."pipeline/rows/rows.py"]
ignore = ["unused"]
[lucidlint."pipeline/layout.py"]
ignore = ["unused", "long-param-list"]
[lucidlint."pipeline/model/vlm.py"]
ignore = ["unused"]
[lucidlint."pipeline/model/vlm_cache.py"]
ignore = ["unused"]
[lucidlint."pipeline/transcribe/transcripts.py"]
ignore = ["unused"]
[lucidlint."pipeline/evals/eval_geometry.py"]
ignore = ["unused"]
[lucidlint."pipeline/evals/eval_review.py"]
ignore = ["unused"]
[lucidlint."pipeline/evals/spike_vlm_contract.py"]
ignore = ["unused"]
[lucidlint."pipeline/evals/walk_review.py"]
ignore = ["unused"]
[lucidlint."tools/text.py"]
ignore = ["unused"]
[lucidlint."tools/box.py"]
ignore = ["unused"]
[lucidlint."tools/gates.py"]
ignore = ["unused"]
[lucidlint."tools/pii_markers.py"]
ignore = ["unused"]
[lucidlint."tools/attestation.py"]
ignore = ["unused"]
[lucidlint."tools/archive.py"]
ignore = ["unused", "god-class", "partition"]
[lucidlint."tools/memory.py"]
ignore = ["unused", "data-clump"]
[lucidlint."tools/records.py"]
