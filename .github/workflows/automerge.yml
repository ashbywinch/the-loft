name: Arm auto-merge

# GitHub's auto-merge is a per-PR flag; the repo-level "allow auto-merge"
# setting only permits one to exist. Nothing sets the flag automatically, so
# every PR needed a hand-run `gh pr merge --auto` — this job does it on open,
# on every push, and again on every review. The human approval and the
# required checks remain the gate: the job never approves, never merges, and
# the `protect-main` ruleset still demands one approving review plus a green
# `build-and-test`. It only removes the arming click.
#
# pull_request_target, not pull_request: the job needs a write token, and a
# PR from a fork gets a read-only one. The workflow file always comes from the
# base branch, and the job checks out no PR code — it reads PR metadata and
# arms the flag, nothing else. A fork PR is skipped by the `if` below.
#
# `pull_request_review` is here because arming once at open is not enough:
# GitHub drops auto-merge when the head branch changes in a way it does not
# attribute to the PR (it did on the first PR this ran for), and a dropped
# flag leaves an approval doing nothing. Re-arming on the review means the
# approval always lands.
#
# `synchronize` is deliberately NOT combined with a branch update: a push made
# with GITHUB_TOKEN does not trigger workflows, so `update-branch` here would
# leave the new head SHA with no required check reported and the armed merge
# waiting forever. A PR that falls BEHIND main under the ruleset's strict
# check needs one real push (or GitHub's own Update branch button); this job
# arms it either way.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  pull_request_review:
    types: [submitted]

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # enable auto-merge on the PR

jobs:
  arm:
    # Dependabot PRs keep their own policy (patch/minor only, never a
    # github-actions ref bump) in dependabot-automerge.yml; arming them here
    # too would bypass it.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Arm auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Idempotent: every push fires this, and an already-armed PR must not
          # fail the job. `--jq` prints an EMPTY line for a null field, not the
          # word null — comparing to "null" alone marks every PR as armed.
          armed=$(gh pr view "$PR" --repo "$REPO" --json autoMergeRequest --jq '.autoMergeRequest')
          case "$armed" in
            "" | null) : ;;
            *)
              echo "auto-merge already armed"
              exit 0
              ;;
          esac
          # --auto arms GitHub's native auto-merge: the PR merges itself once
          # the ruleset's one approving review and every required check are in.
          # --merge, not --rebase: the ruleset allows merge commits only.
          gh pr merge "$PR" --repo "$REPO" --auto --merge
