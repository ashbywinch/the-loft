# Fast checks only — lint and typecheck, never the full test suite.
# The same targets CI runs; hooks stay seconds-fast.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: pyrefly
        name: pyrefly
        entry: .venv/bin/python scripts/pyrefly-lock.py check --pyrefly-config pyrefly.toml # the both-direction baseline lock — bare check fails on the 19 baselined errors (2026-09-22); NO `make` here: setup would uv-sync under pre-commit's stash and strip deps the lock needs
        language: system
        types: [python]
        pass_filenames: false # project check — pyrefly needs the whole-project context, not per-file
      - id: lucidlint
        name: lucidlint (the whole repo, baselined)
        entry: make lucidlint
        language: system
        types: [python]
        pass_filenames: false
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks