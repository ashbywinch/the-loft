[openai]
custom_llm_provider = "openai"
api_base = "https://gateway.ai.cloudflare.com/v1/e21a5be58ac1e8f7d5619539feb2dc3d/default/compat"  # the review path reads api_base from the CONFIG, not the env — unset, the handler fell back to the default endpoint (401 "Invalid API key", swallowed)

[litellm]
# Cloudflare timeout/retry headers + the analytics tag — the action sends them
# as HTTP headers (skill://cloudflare-ai-gateway). Sent as a JSON STRING: the
# handler runs json.loads() on this value, so an inline TOML table fails every
# call ("the JSON object must be str, bytes or bytearray, not DynaBox").
extra_headers = '{"cf-aig-request-timeout": "1800000", "cf-aig-max-attempts": "0", "cf-aig-backoff": "exponential", "cf-aig-metadata": "{\"source\":\"review\",\"repo\":\"family-history-album\"}"}'

[config]
model = "openai/dynamic/fallback2"  # the handler strips the "openai/" prefix and sends "dynamic/fallback2" to api_base — the gateway's fallback2 DYNAMIC ROUTE (OpenCode primary → DeepSeek fallback). A raw provider model id (deepseek/deepseek-v4-flash, until 2026-10-17) bypasses the route: no failover, and the provider's "Insufficient Balance" killed every review (2026-10-17). The 2026-09-23 401 came from the missing [openai] custom_llm_provider, not the prefix.
custom_model_max_tokens = 128000
max_model_tokens = 128000
ai_timeout = 1800
fallback_models = []
repo_context_from_default_branch = false
repo_context_files = [
    "docs/PRD/PRD.md",
    "docs/coding-standards.md",
    "docs/testing-standards.md",
    "docs/writing-documentation.md",
    "docs/documentation-structure.md",
    "docs/ux-standards.md",
    "docs/UX.md",
]


[pr_reviewer]
# NOTE — incremental is NOT the enable_incremental key below: v0.41.1 only
# reads the -i flag on the /review command (pr_reviewer.parse_incremental),
# so the push command carries it (see [github_action_config]). And with an
# incremental review, persistent_comment MUST be false: the commit range
# anchors on the previous review comment's created_at
# (github_provider.get_commit_range), which for an in-place-updated
# persistent comment is frozen at the FIRST review — every push would
# re-review the whole PR. Verified 2026-08-11: the token counter showed the
# full 144k-token PR diff on every push while the marker claimed
# "Review updated until commit".
persistent_comment = false
require_tests_review = true
require_security_review = true
num_max_findings = 50
# Publish each finding as a verified inline review comment (the pinned action
# implements get_persistent_comment_bodies/get_recent_inline_comment_bodies).
inline_key_issues = true
extra_instructions = "Check the PR against each file in repo_context_files. Before checking compliance, derive the domain glossary from docs/PRD/PRD.md and docs/TECHSPEC.md (entities, actions, personas, states, object model), then read the diff against it two ways. Vocabulary: a domain-level name (class, module, public entry point, domain-typed field) using technical or vague words instead of the documented term is a finding. Latent concepts: domain behaviour smeared across several functions or buried inside one, owned by no identifier, is equally a finding — draw it out under a glossary name, proposing a new glossary term where none fits. Generic helper, plumbing, and config-key names are not glossary checks.  Add a 'Compliance' section per doc, listing any violations found or 'No violations'. Flag violations as findings, not just notes: style and semantic deviations from docs/coding-standards.md, test-standard deviations from docs/testing-standards.md, requirement deviations from docs/PRD/PRD.md (a change that violates a stated requirement, constraint, persona, or JTBD is a finding), documentation-standard deviations from docs/writing-documentation.md (docs failing the documentation-quality checklist — context efficiency, density, no-duplication, one topic per file), folder-structure deviations from docs/documentation-structure.md (missing or malformed required docs — PRD with JTBD/personas/constraints/user requirements, TECHSPEC with choices/spikes/diagrams, UX.md, PLAN with the software's phase inputs/outputs and quality gates — every doc discoverable from AGENTS.md, skills exempt from reachability since the harness discovers them), and UX deviations from docs/ux-standards.md. Structural findings the standards name are findings too: a missed class (bare dict/tuple/list in a record position), a name that violates the object model or domain-noun rules, and separation-of-concerns violations. Suppression comments are findings when their why fails the evidence bar in docs/coding-standards.md ('Suppressions carry checkable evidence') — review every exemption form that section names (`lucidlint: ignore`, `ignore-file`, `# type: ignore`, `#[allow(...)]`, `# noqa`), not only the lucidlint ones."


[pr_code_suggestions]
persistent_comment = true

[github_action_config]
handle_push_trigger = true
# -i on /review is the ONLY incremental enabler in v0.41.1 (the
# enable_incremental config key does not exist in this version) — without
# it every push re-reviews the ENTIRE PR and the diff eventually blows the
# 128k token cap (2026-08-11: 144757 tokens, the review died).
# /improve has NO incremental support in any pr-agent version (verified
# v0.41.1 and main: pr_code_suggestions has no incremental machinery, and
# -i on it is a no-op) — it is a full-PR pass by upstream design
push_commands = ["/review -i", "/improve"]
