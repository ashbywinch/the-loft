# long-param-list: STOPPED (re-checked 2026-11-20, one finding). The archive's
# public identification verb takes the determination's own fields (item, kind,
# record, decision, basis, actor). `Determination` exists for the dispositions,
# but the signature is pinned by tests/test_archive.py (five positional
# arguments plus `actor=`) and the server route: a <=5-parameter form renames
# an argument the suite passes, so the def and its call sites move together.
# partition: STOPPED, not waived. The rule's field partition on Archive is the
# migration's own seam: the live verbs (identities, reviews, items — the four
# bind_*_service flips) and the file path they fall back to until E2
# (REWRITE-PLAN) touch disjoint collaborators, so the class reads as the two
# halves it is mid-way between. Every candidate split reproduces that two-hub
# structure, and the facade's public verbs (get_item, save_item, get_identity,
# publish, ...) are pinned by the suite and the server: splitting them off the
# facade would either move the API between objects or turn the verbs into
# one-line delegators — a second facade the migration would have to undo. The
# page path's own partition (bind_page_service + correct_page_rows) WAS fixed
# in code: `PageWork` owns the bound service and its export (2026-11-20).
[lucidlint."tools/archive.py"]
ignore = ["unused", "god-class", "partition", "long-param-list"]
[lucidlint."tools/memory.py"]
ignore = ["unused"]
[lucidlint."tools/records.py"]
ignore = ["unused"]

[lucidlint."pipeline/chain.py"]
ignore = ["unused"]

[lucidlint."pipeline/evals/eval_scoring.py"]
ignore = ["unused"]

# long-param-list: two STOPPED findings. `record_confirmation` (10) and
# `reprocess_page_transcription` (13) are called with their opening
# arguments positionally plus named seams (archive=, title=/date=,
# registry_dir=, transcribe=/rows_text=) in tests/test_sync.py and
# tests/pipeline/test_adopt.py: a <=5-parameter form renames an argument the
# suite passes, so the def and its call sites move together. The seams DO
# travel as records now: `_PageRead`/`_PageSidecars` (the private helpers
# take them) and `BatchReadings` (the crash recovery). The follow-up table is
# in docs/PLAN/lucidlint-review-log.md, 2026-11-20 — names and signatures.
[lucidlint."pipeline/api/sync.py"]
ignore = ["long-param-list"]

[lucidlint."tools/gedcom_document.py"]
ignore = ["god-class"]

# latent-class: the band-size sweep's locals carry the run's state — no class for one call site (recorded 2026-10-08, held not split)
[lucidlint."pipeline/evals/eval_band_size.py"]
ignore = ["god-class"]

# fakefs: the exporter tests use a real SQLite file and a real archive tree on
# tmp_path — the append-only store, sqlite semantics and the versioned file
# chain are the subject, not incidental I/O (docs/testing-standards.md).
[lucidlint."tests/live/**"]
ignore = ["fakefs"]
