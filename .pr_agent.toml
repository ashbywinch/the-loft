[openai]
custom_llm_provider = "openai"
api_base = "https://gateway.ai.cloudflare.com/v1/e21a5be58ac1e8f7d5619539feb2dc3d/default/compat"  # the review path reads api_base from the CONFIG, not the env — unset, the handler fell back to the default endpoint (401 "Invalid API key", swallowed)

[litellm]
# Cloudflare timeout/retry headers + the analytics tag — the action sends them
# as HTTP headers (skill://cloudflare-ai-gateway). Sent as a JSON STRING: the
# handler runs json.loads() on this value, so an inline TOML table fails every
# call ("the JSON object must be str, bytes or bytearray, not DynaBox").
extra_headers = '{"cf-aig-request-timeout": "1800000", "cf-aig-max-attempts": "0", "cf-aig-backoff": "exponential", "cf-aig-metadata": "{\"source\":\"review\",\"repo\":\"family-history-album\"}"}'

[config]
model = "openai/dynamic/fallback2"  # the handler strips the "openai/" prefix and sends "dynamic/fallback2" to api_base — the gateway's fallback2 DYNAMIC ROUTE (OpenCode primary → DeepSeek fallback). A raw provider model id (deepseek/deepseek-v4-flash, until 2026-10-17) bypasses the route: no failover, and the provider's "Insufficient Balance" killed every review (2026-10-17). The 2026-09-23 401 came from the missing [openai] custom_llm_provider, not the prefix.
custom_model_max_tokens = 128000
max_model_tokens = 128000
ai_timeout = 1800
fallback_models = []
repo_context_from_default_branch = false
# The renderer caps rendered context at repo_context_max_lines (default 500) and
# STOPS at the first file that overruns - every later file is dropped silently.
# These files are ~2398 lines together. Raise this whenever the list grows.
# See pr_agent/algo/repo_context.py.
repo_context_max_lines = 2700
repo_context_files = [
    "docs/PRD/PRD.md",
    "docs/coding-standards.md",
    "docs/testing-standards.md",
    "docs/writing-documentation.md",
    "docs/documentation-structure.md",
    "docs/ux-standards.md",
    "docs/UX.md",
]


[pr_reviewer]
# A full review on every push, posted as a persistent comment: that path is
# the only one that publishes the "PR Agent - Review" check run (pr_reviewer.run
# reaches _publish_check_run only on the persistent, non-incremental branch),
# and the check run is the gate's coverage artifact. Incremental reviews publish
# no check run, and their anchor is the previous review comment's created_at —
# a commit pushed while a review runs is then never read (it lands before the
# next anchor, and the next run skips as "no new files").
persistent_comment = true
require_tests_review = true
require_security_review = true
num_max_findings = 50
# Publish each finding as a verified inline review comment (the pinned action
# implements get_persistent_comment_bodies/get_recent_inline_comment_bodies).
inline_key_issues = true
extra_instructions = "Check the PR against each file in repo_context_files. Before checking compliance, derive the domain glossary from docs/PRD/PRD.md and docs/TECHSPEC.md (entities, actions, personas, states, object model), then read the diff against it two ways. Vocabulary: a domain-level name (class, module, public entry point, domain-typed field) using technical or vague words instead of the documented term is a finding. Latent concepts: domain behaviour smeared across several functions or buried inside one, owned by no identifier, is equally a finding — draw it out under a glossary name, proposing a new glossary term where none fits. Generic helper, plumbing, and config-key names are not glossary checks.  Report every violation as its own finding with path:line and the rule it breaks; never report something as compliant unless you checked it against the file that states the rule. Flag violations as findings, not just notes: style and semantic deviations from docs/coding-standards.md, test-standard deviations from docs/testing-standards.md, requirement deviations from docs/PRD/PRD.md (a change that violates a stated requirement, constraint, persona, or JTBD is a finding), documentation-standard deviations from docs/writing-documentation.md (docs failing the documentation-quality checklist — context efficiency, density, no-duplication, one topic per file), folder-structure deviations from docs/documentation-structure.md (missing or malformed required docs — PRD with JTBD/personas/constraints/user requirements, TECHSPEC with choices/spikes/diagrams, UX.md, PLAN with the software's phase inputs/outputs and quality gates — every doc discoverable from AGENTS.md, skills exempt from reachability since the harness discovers them), and UX deviations from docs/ux-standards.md. Structural findings the standards name are findings too: a missed class (bare dict/tuple/list in a record position), a name that violates the object model or domain-noun rules, and separation-of-concerns violations. Suppression comments are findings when their why fails the evidence bar in docs/coding-standards.md ('Suppressions carry checkable evidence') — review every exemption form that section names (`lucidlint: ignore`, `ignore-file`, `# type: ignore`, `#[allow(...)]`, `# noqa`), not only the lucidlint ones."


[pr_code_suggestions]
# DISABLED for the auto run (2026-11-12). The suggestions generator uses the
# global [config] model chain and, on this PR's 150k-token numbered diff, the
# model returns empty content (finish_reason: length) after ~30 minutes; the
# action then fails the whole review run for an advisory tool. /improve stays
# available as a deliberate comment-triggered command (we do not auto-run it).
persistent_comment = true

[github_action_config]
handle_push_trigger = true
# The agent harness pushes as omp-harness[bot]; the action's default bot-skip
# would silently never review its pushes (the fail-loud verify job caught it:
# "Skipping synchronize: bot commit detected"). Review every push.
push_trigger_ignore_bot_commits = false
# -i on /review is the ONLY incremental enabler in v0.41.1 (the
# enable_incremental config key does not exist in this version) — without
# it every push re-reviews the ENTIRE PR and the diff eventually blows the
# 128k token cap (2026-08-11: 144757 tokens, the review died).
# /improve has NO incremental support in any pr-agent version (verified
# v0.41.1 and main: pr_code_suggestions has no incremental machinery, and
# -i on it is a no-op) — it is a full-PR pass by upstream design
push_commands = ["/review"]
skip_commands = ["/skip"]


[github]
# Publish the review as a completed "PR Agent - Review" check run on the head
# SHA. This is the gate's authoritative coverage signal
# (pipeline/evals/check_review_posted.py): the check run exists only when the
# review text was in hand. Without it the gate can only read comments, and a
# CANCELLED run's guide reads exactly like a completed review — 2026-11-14,
# PR #116: two runs were cancelled mid-review, the third skipped as
# "incremental, no new files", and the gate accepted the skip. The B4a code
# was never reviewed.
publish_as_check_run = true
