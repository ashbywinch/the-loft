name: CI
on:
  push:
  workflow_dispatch:
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write # the coverage comment step needs it
jobs:
  build-and-test:
    env:
      # the eval key: the current convention (OPENAI_API_KEY = the Cloudflare
      # gateway token, OPENAI_BASE_URL = the gateway endpoint) — the legacy
      # LOFT_AI_KEY secret left the repo (2026-09-05), leaving the eval step's
      # presence guard permanently false (evals silently never ran)
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: https://gateway.ai.cloudflare.com/v1/e21a5be58ac1e8f7d5619539feb2dc3d/default/compat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - name: Fail if family-history-album goes public (real family content)
        # The private repo carries real letter transcriptions, names and health
        # history — the privacy posture (PRD F6, TECHSPEC §7) requires it to
        # stay private; this makes a public flip fail CI instead of leaking the
        # archive. The public the-loft ships a scrubbed, dataset-free tree and
        # is exempt by name.
        run: |
          private=$(gh api repos/${{ github.repository }} --jq .private)
          name=$(gh api repos/${{ github.repository }} --jq .name)
          if [ "$private" != "true" ] && [ "$name" = "family-history-album" ]; then
            echo "::error::This repository contains real family content and MUST stay private." >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - run: make setup
      - run: make lint-github
      - run: make coverage # the gate: lint + typecheck + the suites ONCE, instrumented (2026-08-11: make test + make coverage used to run pytest and vitest twice)
      - run: make verify # the archive-quality data checks — the gate keeps them; they skip in CI (no archive in the checkout) and run locally
      - run: make lucidlint # the code-health gate, wired from its own repo (github.com/ashbywinch/lucidlint); no baseline — a finding fails the gate and must be fixed (2026-08-29)
      - name: Provision .venv-htr for the evals' layout subprocess
        if: ${{ github.actor != 'dependabot[bot]' || github.ref == 'refs/heads/main' }}
        run: make setup-htr
      - name: Note the dependabot eval skip
        # Evals on dependabot runs are IMPOSSIBLE, not optional: GitHub strips
        # secrets from dependabot-triggered runs, so there is no key to run
        # with. The skip is mandatory; this note makes it loud, never silent
        # (the fail-fast rule applied to the skip itself, 2026-08-29). The real
        # gate for merged dependabot changes is main's own evals run.
        if: ${{ github.actor == 'dependabot[bot]' && github.ref != 'refs/heads/main' }}
        run: echo "::warning::Real-model evals cannot run on dependabot runs (GitHub strips secrets here); main's evals run gates merged changes"
      - name: Real-model evals
        # Runs on every non-dependabot run: a missing key FAILS the gate loudly
        # (fail-fast rule) — never test for key presence, never silently skip
        # (2026-08-14). Except: GitHub strips secrets from dependabot-triggered
        # runs, so the key is always absent there and the step can only fail —
        # skip evals for dependabot PRs only, never on main (2026-08-28).
        if: ${{ github.actor != 'dependabot[bot]' || github.ref == 'refs/heads/main' }}
        run: make evals
      - name: Coverage summary (Python tools)
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          badge: true
          fail_below_min: true
          thresholds: '65 90' # floor below the measured 73.11% (2026-09-22) — raise as coverage lands; tracks the 90% goal
          format: markdown
          output: both
      - name: Post coverage comment
        uses: marocchino/sticky-pull-request-comment@v3
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md
