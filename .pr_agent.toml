[openai]
custom_llm_provider = "openai"
api_base = "https://gateway.ai.cloudflare.com/v1/e21a5be58ac1e8f7d5619539feb2dc3d/default/compat"  # the review path reads api_base from the CONFIG, not the env — unset, the handler fell back to the default endpoint (401 "Invalid API key", swallowed)

[litellm]
# Cloudflare timeout/retry headers + the analytics tag — the action sends them
# as HTTP headers (skill://cloudflare-ai-gateway). Sent as a JSON STRING: the
# handler runs json.loads() on this value, so an inline TOML table fails every
# call ("the JSON object must be str, bytes or bytearray, not DynaBox").
extra_headers = '{"cf-aig-request-timeout": "1800000", "cf-aig-max-attempts": "0", "cf-aig-backoff": "exponential", "cf-aig-metadata": "{\"source\":\"review\",\"repo\":\"family-history-album\"}"}'

[config]
model = "openai/dynamic/fallback2"  # the handler strips the "openai/" prefix and sends "dynamic/fallback2" to api_base — the gateway's fallback2 DYNAMIC ROUTE (OpenCode primary → DeepSeek fallback). A raw provider model id (deepseek/deepseek-v4-flash, until 2026-10-17) bypasses the route: no failover, and the provider's "Insufficient Balance" killed every review (2026-10-17). The 2026-09-23 401 came from the missing [openai] custom_llm_provider, not the prefix.
custom_model_max_tokens = 128000
max_model_tokens = 128000
ai_timeout = 1800
fallback_models = []
repo_context_from_default_branch = false
repo_context_files = [
    "docs/PRD/PRD.md",
    "docs/coding-standards.md",
    "docs/testing-standards.md",
    "docs/writing-documentation.md",
    "docs/documentation-structure.md",
    "docs/ux-standards.md",
    "docs/UX.md",
]


[pr_reviewer]
# NOTE — incremental is NOT the enable_incremental key below: v0.41.1 only
# reads the -i flag on the /review command (pr_reviewer.parse_incremental),
# so the push command carries it (see [github_action_config]). And with an
# incremental review, persistent_comment MUST be false: the commit range
# anchors on the previous review comment's created_at
# (github_provider.get_commit_range), which for an in-place-updated
# persistent comment is frozen at the FIRST review — every push would
# re-review the whole PR. Verified 2026-08-11: the token counter showed the
# full 144k-token PR diff on every push while the marker claimed
# "Review updated until commit".
persistent_comment = false
require_tests_review = true
require_security_review = true
num_max_findings = 50
extra_instructions = "Check the PR against each file in repo_context_files. Add a 'Compliance' section per doc, listing any violations found or 'No violations'. Flag violations as findings, not just notes: requirement deviations from docs/PRD/PRD.md (a change that violates a stated requirement, constraint, persona, or JTBD is a finding), documentation-standard deviations from docs/writing-documentation.md (docs failing the documentation-quality checklist — context efficiency, density, no-duplication, one topic per file — including that every doc is discoverable from AGENTS.md; skills are exempt from reachability — the harness discovers them (see docs/documentation-structure.md)), and folder-structure deviations from docs/documentation-structure.md (missing or malformed required docs, or a doc that AGENTS.md cannot lead to). The canonical code-repo standards (coding, testing, UX) live in standards/ and are scaffolded into code repos — they do not govern omp-config's own docs, but a PR that edits one must keep it consistent with the rest of the canonical set. A change to a skill or standard must keep the repo self-check (make test) green and mention that the change needs make install + omp restart to take effect."


[pr_code_suggestions]
persistent_comment = true

[github_action_config]
handle_push_trigger = true
auto_review = true
# The review pass only (user, 2026-10-26). /improve is a full-PR pass by
# upstream design, and on 2026-10-26 it burned its whole output budget
# reasoning — finish_reason length, empty content — and failed the action,
# so a green PR wore a red check for a suggestion nothing needed.
auto_improve = false
# -i on /review is the ONLY incremental enabler in v0.41.1 (the
# enable_incremental config key does not exist in this version) — without
# it every push re-reviews the ENTIRE PR and the diff eventually blows the
# 128k token cap (2026-08-11: 144757 tokens, the review died).
push_commands = ["/review -i"]
