<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6efe2" />
    <title>The Loft — a family museum</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="vendor/leaflet.css" />
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p style="padding: 1rem; font: 16px system-ui, sans-serif">
        The Loft needs JavaScript. Enable it for this site, or open the archive in a current browser.
      </p>
    </noscript>
    <script src="vendor/leaflet.js"></script>
    <script src="vendor/leaflet-heat.js"></script>
    <script>
      // Boot diagnostics: a blank #app is a boot failure — the module graph,
      // the identity check, the data load, or the route render. This script
      // is deliberately ES5 so it runs even when the module graph cannot, and
      // it replaces the loading marker with the failure (a blank page must
      // never be the visible outcome).
      (function () {
        var app = document.getElementById("app");
        window.__loftBoot = [];
        window.__loftStage = "inline script ran";

        var loading = document.createElement("div");
        loading.id = "boot-loading";
        loading.setAttribute(
          "style",
          "padding:1rem;font:16px system-ui,sans-serif;color:#1b1b1b;background:#fff;",
        );
        loading.textContent = "The Loft — loading…";
        if (app) app.appendChild(loading);

        function paintBootFailure(what) {
          console.error("[boot]", what);
          window.__loftBoot.push(what);
          var root = document.getElementById("app");
          if (!root) return;
          root.innerHTML = "";
          var panel = document.createElement("div");
          panel.className = "empty";
          panel.setAttribute(
            "style",
            "padding:1rem;font:16px system-ui,sans-serif;color:#1b1b1b;background:#fff;",
          );
          panel.textContent = "The app failed to start (" + what + "). Reload to retry.";
          root.appendChild(panel);
        }

        window.addEventListener("error", function (event) {
          paintBootFailure(event.message || "script error");
        });
        window.addEventListener("unhandledrejection", function (event) {
          var reason = (event.reason && (event.reason.message || event.reason)) || event.reason;
          paintBootFailure(String(reason));
        });

        setInterval(function () {
          var root = document.getElementById("app");
          var first = root && root.firstElementChild;
          if (first && first.id === "boot-loading") {
            first.textContent = "The Loft — still loading… stage: " + (window.__loftStage || "module load");
          }
        }, 2000);

        // The module graph can fail before boot() runs. Say so after 8s
        // instead of leaving the marker (or a blank page) forever.
        setTimeout(function () {
          var stage = window.__loftStage;
          if (stage === "inline script ran" || stage === "module queued" || stage === "module load" || stage === "start") {
            paintBootFailure("boot did not finish (stage: " + stage + ")");
          }
        }, 8000);
      })();
    </script>
    <script type="module">
      import { boot } from "./app.js";
      boot();
    </script>
    <script>
      // A classic marker after the module: modules are deferred, so this
      // runs while the module graph is still loading. If the watchdog sees
      // this stage, the module was queued but never reached boot().
      window.__loftStage = "module queued";
    </script>
  </body>
</html>
