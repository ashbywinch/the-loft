[openai]
custom_llm_provider = "openai"
api_base = "https://gateway.ai.cloudflare.com/v1/e21a5be58ac1e8f7d5619539feb2dc3d/default/compat"  # the review path reads api_base from the CONFIG, not the env — unset, the handler fell back to the default endpoint (401 "Invalid API key", swallowed)

[litellm]
# Cloudflare timeout/retry headers + the analytics tag — the action sends them
# as HTTP headers (skill://cloudflare-ai-gateway). Sent as a JSON STRING: the
# handler runs json.loads() on this value, so an inline TOML table fails every
# call ("the JSON object must be str, bytes or bytearray, not DynaBox").
extra_headers = '{"cf-aig-request-timeout": "1800000", "cf-aig-max-attempts": "0", "cf-aig-backoff": "exponential", "cf-aig-metadata": "{\"source\":\"review\",\"repo\":\"family-history-album\"}"}'

[config]
model = "openai/dynamic/fallback2"  # the handler strips the "openai/" prefix and sends "dynamic/fallback2" to api_base — the gateway's fallback2 DYNAMIC ROUTE (OpenCode primary → DeepSeek fallback). A raw provider model id (deepseek/deepseek-v4-flash, until 2026-10-17) bypasses the route: no failover, and the provider's "Insufficient Balance" killed every review (2026-10-17). The 2026-09-23 401 came from the missing [openai] custom_llm_provider, not the prefix.
# The route answers deepseek-v4-flash, whose output ceiling is far below 128k;
# claiming 128k made pr-agent ask for a review longer than the model can emit
# and the answer was truncated (measured: #134, run 44736435686).
custom_model_max_tokens = 1000000
max_model_tokens = 1000000
ai_timeout = 1800
fallback_models = []
repo_context_from_default_branch = true  # the standards come from main: a PR must not supply the rule it is judged by
# The renderer caps rendered context at repo_context_max_lines (default 500) and
# STOPS at the first file that overruns - every later file is dropped silently.
# These files are ~2864 lines together. Raise this whenever the list grows.
# See pr_agent/algo/repo_context.py.
repo_context_max_lines = 3200
repo_context_files = [
    "docs/PRD/PRD.md",
    "docs/coding-standards.md",
    "docs/testing-standards.md",
    "docs/writing-documentation.md",
    "docs/documentation-structure.md",
    "docs/ux-standards.md",
    "docs/UX.md",
    "docs/TECHSPEC.md",
    "docs/object-model.md",
]


[pr_reviewer]
# A full review on every push: that path is the only one that publishes the
# "PR Agent - Review" check run (pr_reviewer.run reaches _publish_check_run only
# on the persistent, non-incremental branch), and the check run is the gate's
# coverage artifact. With publish_as_check_run the review is published AS the
# check run — the PR comment is not updated, so read the review under Checks.
# Incremental reviews publish no check run, and their anchor is the previous
# review comment's created_at — a commit pushed while a review runs is then
# never read (it lands before the next anchor, and the next run skips as "no
# new files").
persistent_comment = true
require_tests_review = true
require_security_review = true
num_max_findings = 50
# Publish each finding as a verified inline review comment (the pinned action
# implements get_persistent_comment_bodies/get_recent_inline_comment_bodies).
inline_key_issues = true
extra_instructions = """
- **Scope.** Read the diff against the files in repo_context_files. Cite the file that states a rule when you invoke it, and never call something compliant without checking it there. Each violation is its own finding with path:line.
- **Vocabulary.** Glossary: docs/PRD/PRD.md and docs/object-model.md. Judge a name in the domain of the code that holds it — the reader, the layout, the live store and the evals each own their terms. Report a name that contradicts the model, or that is not a term of its domain where one exists. Never report absence: the model holds the concepts a reader cannot infer and the word two concepts might share, not every identifier.
- **Latent concepts.** Report domain behaviour smeared across functions, or buried in one with no identifier owning it, and propose the term that names it.
- **Requirements.** Report a change that violates a stated requirement, constraint, persona or job in docs/PRD/PRD.md.
- **Coding standards.** Report style and semantic deviations from docs/coding-standards.md.
- **Tests.** Report deviations from docs/testing-standards.md.
- **Documentation.** Report docs that fail the quality checklist in docs/writing-documentation.md: context efficiency, density, no duplication, one topic per file.
- **Folder structure.** Report a missing or malformed required doc in docs/documentation-structure.md. Every doc must be reachable from AGENTS.md; skills are exempt because the harness discovers them.
- **UX.** Report deviations from docs/ux-standards.md.
- **Structure.** Report a missed class (a bare dict, tuple or list in a record position), a name that violates the object model, and a separation-of-concerns violation.
- **Suppressions.** Report a suppression whose why fails the evidence bar in docs/coding-standards.md, in every form that section names (`lucidlint: ignore`, `ignore-file`, `# type: ignore`, `#[allow(...)]`, `# noqa`). Only code that carries one is checked; asking for one where none exists is not a finding.
"""


[pr_code_suggestions]
# DISABLED for the auto run (2026-11-12). The suggestions generator uses the
# global [config] model chain and, on this PR's 150k-token numbered diff, the
# model returns empty content (finish_reason: length) after ~30 minutes; the
# action then fails the whole review run for an advisory tool. /improve stays
# available as a deliberate comment-triggered command (we do not auto-run it).
persistent_comment = true

[github_action_config]
handle_push_trigger = true
# The agent harness pushes as omp-harness[bot]; the action's default bot-skip
# would silently never review its pushes (the fail-loud verify job caught it:
# "Skipping synchronize: bot commit detected"). Review every push.
push_trigger_ignore_bot_commits = false
# A full review on every push, no -i: the check run is only published on the
# non-incremental path (see [pr_reviewer]), so an incremental review would
# leave the gate red. A PR whose cumulative diff outgrows the 128k token cap
# dies at pruning and fails the gate with the size reason — the cap is the
# limit to fix, not the incremental flag.
# /improve has NO incremental support in any pr-agent version (verified
# v0.41.1 and main: pr_code_suggestions has no incremental machinery, and
# -i on it is a no-op) — it is a full-PR pass by upstream design.
push_commands = ["/review"]
skip_commands = ["/skip"]


[github]
# Publish the review as a completed "PR Agent - Review" check run on the head
# SHA — the gate's coverage signal (pipeline/evals/check_review_posted.py). The
# check run exists only when the review text was in hand; without it the gate
# can only read comments, and a cancelled run's guide reads exactly like a
# completed review. The review text caps at 65,535 characters; the tail is
# dropped on a review that large.
publish_as_check_run = true
