<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6efe2" />
    <title>The Loft — a family museum</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="vendor/leaflet.css" />
  </head>
  <body>
    <div id="app"></div>
    <script src="vendor/leaflet.js"></script>
    <script src="vendor/leaflet-heat.js"></script>
    <script>
      // Boot diagnostics (2026-08-08): a blank #app is a boot failure — the
      // module graph, the identity check, the data load, or the route render.
      // A module-graph failure never reaches app.js, so this inline listener
      // paints the error into #app instead of leaving it blank, and every
      // failure is logged to the console with the stage. window.__loftBoot
      // holds the trace for the console.
      window.__loftBoot = [];
      // A visible loading marker painted IMMEDIATELY: a white page with no
      // marker means the page's scripts never ran (a browser-level block),
      // while a stuck marker shows the last boot stage. The stage is updated
      // by boot() via window.__loftStage; the timer repaints while the app
      // is still empty so a hang is visible, not blank.
      window.__loftStage = "inline script ran";
      const loading = Object.assign(document.createElement("div"), {
        id: "boot-loading",
        textContent: "The Loft — loading…",
      });
      document.getElementById("app")?.append(loading);
      setInterval(() => {
        const root = document.getElementById("app");
        const first = root && root.firstElementChild;
        if (first && first.id === "boot-loading") {
          loading.textContent = `The Loft — still loading… stage: ${window.__loftStage || "module load"}`;
        }
      }, 2000);
      const paintBootFailure = (what) => {
        console.error("[boot]", what);
        const root = document.getElementById("app");
        if (root && !root.childElementCount) {
          root.replaceChildren(
            Object.assign(document.createElement("div"), {
              className: "empty",
              textContent: `The app failed to start (${what}). Reload to retry.`,
            }),
          );
        }
      };
      window.addEventListener("error", (event) => {
        window.__loftBoot.push("error: " + event.message);
        paintBootFailure(event.message);
      });
      window.addEventListener("unhandledrejection", (event) => {
        const reason = event.reason && (event.reason.message || event.reason) || event.reason;
        window.__loftBoot.push("rejection: " + reason);
        paintBootFailure(String(reason));
      });
    </script>
    <script type="module">
      import { boot } from "./app.js";
      boot();
    </script>
  </body>
</html>
