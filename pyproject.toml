[project]
name = "the-loft"
version = "0.1.0"
description = "Family history museum web app — a lens over a folder of family artifacts."
readme = "README.md"
requires-python = ">=3.14"  # PEP 758 (paren-less except) was accepted but deferred to 3.15 — the parenthesized form is canonical on 3.14
dependencies = [
    "python-dateutil>=2.9.0",
    "dateparser>=1.2.0",
    "uncertainties>=3.2.3",
    "open-clip-torch>=2.24",
    "transformers>=4.44,<5",
    "sentencepiece>=0.2.2",
    "protobuf>=7.35.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.11.0",
    "pre-commit>=3.0.0",
    "pyrefly>=1.2.0",
    "gedcom7>=0.4.1",  # GEDCOM 7.0 strict-spec validator — the export's parse check (2026-08-05)
    "radon>=6.0.1",  # cyclomatic complexity for the vendored code_health gate — never run it without radon (2026-08-15)
    "google-auth>=2.38.0",  # id_token verification for Google sign-in (2026-08-06)
    "google-auth-oauthlib>=1.2.1",  # the PKCE authorization-code flow (houses parity)
    "itsdangerous>=2.2.0",  # signed session cookies
    "fastapi>=0.115.0",  # the server framework (houses parity, 2026-08-06)
    "uvicorn>=0.30.0",  # the ASGI server
    "watchfiles>=1.0.0",  # the reloader's watcher (make serve --reload): enables the reload-excludes (2026-08-16)
    "pillow>=11.0.0",
]

[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tools*"]

[tool.ruff]
# py313, NOT py314: the py314 target follows the PEP 758 draft and strips
# the parens from `except (A, B):` — but CPython 3.14.x still requires them
# (2026-08-11: the fail-loud check's paren-less except crashed CI's 3.14.7
# with SyntaxError while the local 3.14.6 compiled it)
target-version = "py313"
line-length = 120
# vendored from build-tools @ 5668162 — upstream code, not ours to lint
# (the pin is the refresh path)
extend-exclude = ["tools/code_health.py", "tools/check_records.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
# the real-model evals hit the model API (and tesseract), so they are
# SKIPPED by default and run only when selected:
# `pytest -m eval` (all), `-m eval_review`, `-k "arc"` for one piece
# (2026-08-10, user: use the framework's selection, not custom flags).
addopts = "-m 'not eval and not archive'"
markers = [
    "eval: hits the real model API (and tesseract) — run with `pytest -m eval` (make evals), never in make test",
    "eval_review: the import-review evals (tools/eval_review.py)",
    "eval_memory: the memory-capture evals (tools/eval_memory.py)",
    "archive: the archive-quality data checks and the memory evals (which read the archive's projection) — run with `pytest -m archive` (make verify), skipped in CI (no archive in the checkout)",
]

[tool.coverage.run]
omit = ["*/__main__.py"]

