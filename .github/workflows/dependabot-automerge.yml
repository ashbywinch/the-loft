name: Dependabot auto-merge

# pull_request_target, not pull_request: dependabot-triggered runs get a
# read-only token and NO secrets, so `gh pr merge` can never work there. The
# target trigger runs in the base-repo context (workflow file from main, real
# permissions). The job never checks out PR code, so the trigger is safe —
# only PR metadata is read and the merge is armed, not performed, here.
#
# The gate is the PR's AUTHOR, not the event's actor: a dependabot PR whose
# branch was updated by the "Update branch" button (or by another bot) is
# still a dependabot bump, and keying on the actor left exactly those PRs
# un-armed — stale, green, and waiting for a click.
on: pull_request_target

permissions:
  contents: write # the auto-merge performs the merge commit
  pull-requests: write # enabling auto-merge on the PR
jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      # Patch/minor only. Majors stay human (CI green != compatible), and
      # github-actions ref bumps need the SHA-pin treatment per the house
      # standard — never auto-merged.
      - name: Enable auto-merge for patch and minor updates
        if: ${{ steps.metadata.outputs.package-ecosystem != 'github_actions' && (steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor') }}
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --auto arms GitHub's native auto-merge: the PR merges only when every
        # required check has passed (branch protection). Red checks = no merge.
        # Evals on dependabot PRs are impossible, not optional: GitHub strips
        # secrets from dependabot-triggered runs, so the step can only be
        # skipped there (ci.yml's note step makes the skip loud). The real
        # eval gate for dependabot-landed changes is the merged main push —
        # ci.yml always runs evals on main, with keys on every normal merge
        # path, so a regression the PR skipped surfaces on main (2026-08-29).
        run: gh pr merge --auto --merge "$PR_URL"  # the ruleset allows merge commits ONLY — --rebase was blocked, which failed the step and left automerge un-armed (2026-11-14)
