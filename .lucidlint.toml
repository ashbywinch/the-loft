# lucidlint configuration — see docs/PLAN/lucidlint-review-log.md for the
# full reasoning behind every scoped ignore. Each entry is acknowledged debt
# where the tool's rule collides with the repo's coding standards (recorded
# 2026-08-16, first full-repo run).

[lucidlint]
# record-shape: the family is FIXED IN CODE (2026-10-17) — every record is a
# class in a file named after it, owning its wire format; `document/schemas.py`
# (a TypedDict bag) is dissolved and ~150 record modules landed. What the rule
# still reports is a TOOL BUG: it fires on the very pattern its own message
# prescribes — `from_dict(cls, raw: dict[str, Any])`, `to_dict(self) ->
# dict[str, Any]`, and the constant-key literal that method builds (the
# serialization edge, where a bare dict is correct). The minimal repro and the
# reasoning: docs/PLAN/lucidlint-review-log.md §1.5 and §2.2. The rule stays
# ignored so the gate's verdict is not polluted by the tool's own bug; a NEW
# bare dict for a record is still a finding at review.
# global-state: the repo standard REQUIRES named constants and forbids the
# thing this rule should catch — module-level mutable state. On 0.7.1 the rule
# flags every module-level constant (348 on this tree); the repo's answer is
# the rule's own: the value goes on the class that owns the work, privately
# unless another module reads it. The constants sweep moved all 348; the rule
# stays ON so a new module-level value fails the gate. The tool-behaviour note
# (its message permits a constant its own finding still reports) stays in
# docs/PLAN/lucidlint-review-log.md §1.6.
#
# duplicate-module: the rule compares structural skeletons with identifiers
# erased, so distinct records that share a shape — `{"error"}` vs `{"note"}`,
# `x, y` vs `start, end` — read as forks (31 findings). The repo's record
# doctrine deliberately produces such small records; the one byte-identical
# family (five tool-argument records) was deduplicated into PersonIdArgs and
# SearchQueryArgs, which the rule still reports against each other. The
# reasoning: docs/PLAN/lucidlint-review-log.md §1.7. A real fork is still a
# review finding.
ignore = [
    "record-shape",
    "class-module",
    "magic-number",
    "duplicate-module",
]
# noqa: no longer ignored (2026-10-17) — every `# noqa` site now carries its
# why in the tool's format (`# noqa: F401 — the architecture test's
# store-layer marker`), and the six stale `# noqa: E501` markers are deleted
# (those lines are inside the limit; ruff never fired on them). The rule
# stays on so a new bare marker fails the gate.
# class-module: every flagged module is named after its domain noun and
# holds the noun's exception or helper class (htr.py/HtrError, sync.py/
# Outbox, review.py/_Chat) — one reason to change, the standards' stated
# exception to "each class in its own module".
# vague-name: the tool's list includes "Store", which coding-standards.md
# sanctions as a domain noun ("plus Store, Records, Projection, AiClient").
# Every finding the rule still reports is one of the four modules' store
# classes — LiveStore, MemoryLiveStore, PipelineStore, FileStore, DiskStore,
# MemoryStore — so the rule stays ON for the rest of the tree: a vague name
# in any other class fails the gate (re-checked 2026-11-20, six findings).
[lucidlint."loft/live/memory.py"]
ignore = ["vague-name"]
[lucidlint."loft/live/live_store.py"]
ignore = ["vague-name"]
[lucidlint."pipeline/store.py"]
ignore = ["vague-name"]
[lucidlint."tools/file_store.py"]
ignore = ["vague-name"]
[lucidlint."tools/disk_store.py"]
ignore = ["vague-name"]
[lucidlint."tools/memory_store.py"]
ignore = ["vague-name"]

# fakefs: the repo's testing standards permit deterministic real-FS tests
# (tmp_path) — the archive/store tests need real os.replace/subprocess/
# sqlite semantics that pyfakefs cannot fake faithfully; the private
# dataset checks must read the real repo tree. Suppressed at the tests
# scope with the standards' citation.

# unused: the tool counts PRODUCTION references only — it does not see the
# test suite, so a module whose public faces exist for the tests to drive
# reads as dead. That is the repo's seam convention (the DI wrappers, the
# eval harnesses, the detection and layout helpers); each module below names
# the test that drives it. Re-judged 2026-11-20: the entry that named a
# module the tests no longer drive was deleted, and every finding with no
# caller at all was deleted with its code (cache_file.py, attestation.py,
# the geometry eval's clip-location apparatus, file_sha256/text_sha256,
# orientation_from_aspect, PlaceholderObject/PlaceholderAvatar,
# line_orientation_degrees, sync_identities) — a stale suppression is debt,
# and a per-function `ignore unused` comment still counts as a reference on
# this build, so the scoped form is the only one that works (see
# docs/PLAN/lucidlint-review-log.md §1.5, §5.1).

# the eval harnesses: the module IS the harness — its entry points are run
# by the eval-marker suite and the spike's pinning tests.
[lucidlint."pipeline/evals/eval_geometry.py"]
ignore = ["unused"]  # synthetic_letter/synthetic_postcard: tests/pipeline/test_eval_geometry.py
[lucidlint."pipeline/evals/eval_review.py"]
ignore = ["unused"]  # run_flow/run_arc/condition_*/run_caching: tests/test_evals.py
[lucidlint."pipeline/evals/eval_scoring.py"]
ignore = ["unused"]  # score_page: tests/test_eval_scoring.py, tests/test_review_scoring.py
[lucidlint."pipeline/evals/spike_vlm_contract.py"]
ignore = ["unused"]  # parse_answer/user_prompt: tests/pipeline/test_spike_vlm_contract.py
[lucidlint."tools/eval_memory.py"]
ignore = ["unused", "duplicate"]  # load_projection/run_flow/condition_contract: tests/test_evals.py

# the layout and detection seams: the builders and measures the layout tests
# drive directly (the module's entry points; nothing ships calls them
# because the tests are the caller).
[lucidlint."pipeline/detect/ink.py"]
ignore = ["unused"]  # cluster_rows/match_labels/transcription_line_count_plausible: tests/pipeline/test_layout.py
# the reader's public faces (Rows.validate's seam, the ink measures) are what
# the detection tests drive; its god-class debt is stopped, not waived.
[lucidlint."pipeline/detect/reader.py"]
ignore = ["god-class"]
[lucidlint."pipeline/layout.py"]
ignore = ["unused", "long-param-list"]  # multi_layout/admit_and_remap/drop_conflicting_boxes/load_orientation_hint/orientation_passes: tests/pipeline/test_layout.py
[lucidlint."pipeline/model/vlm.py"]
ignore = ["unused"]  # transcribe_with_fallbacks: tests/test_vlm.py
[lucidlint."pipeline/api/approval.py"]
ignore = ["unused"]  # agreement_for: the approval marker's read verb, tests/test_approval.py
[lucidlint."tools/text.py"]
ignore = ["unused"]  # flag_line_words/selfreport_words_by_line/selfreport_by_line: tests/pipeline/test_layout.py
[lucidlint."tools/box.py"]
ignore = ["unused"]  # has_ink/text_line_count: tests/pipeline/test_layout.py, tests/test_review_serve_walk.py
[lucidlint."tools/gates.py"]
ignore = ["unused"]  # glyph_extent_violation: tests/pipeline/test_layout.py

# the guard's own API: `make no-pii` runs the test, so the test IS the
# command and the module's entry points are driven by the suite by design.
[lucidlint."tools/pii_markers.py"]
ignore = ["unused"]  # family_markers/file_offenders: tests/test_no_pii_in_repo.py, tests/test_fiction.py

# the house fiction: a documented data source (AGENTS.md, coding-standards,
# writing-documentation) whose names ARE the content; tests/test_fiction.py
# and the docs are its readers.
[lucidlint."tools/house_fiction.py"]
ignore = ["unused"]  # HouseFiction: tests/test_fiction.py

# partition: STOPPED, not waived. The rule's field partition on Archive is the
# migration's own seam: the live verbs (identities, reviews, items — the four
# bind_*_service flips) and the file path they fall back to until E2
# (REWRITE-PLAN) touch disjoint collaborators, so the class reads as the two
# halves it is mid-way between. Every candidate split reproduces that two-hub
# structure, and the facade's public verbs (get_item, save_item, get_identity,
# publish, ...) are pinned by the suite and the server: splitting them off the
# facade would either move the API between objects or turn the verbs into
# one-line delegators — a second facade the migration would have to undo. The
# page path's own partition (bind_page_service + correct_page_rows) WAS fixed
# in code: `PageWork` owns the bound service and its export (2026-11-20).
[lucidlint."tools/archive.py"]
ignore = ["god-class", "partition", "long-param-list"]
[lucidlint."tools/memory.py"]
ignore = ["data-clump"]
[lucidlint."tools/records.py"]
ignore = ["data-clump", "assembly-class"]

# lucidlint-dist: the vendored release bundle the make target downloads
# (gitignored — the repo's own code never lives there). Its findings are
# the tool reviewing itself; the next download overwrites any edit, and
# the make target verifies the SHA256SUMS, so the bundle is immutable
# input, not repo code (2026-08-29).
[lucidlint."**/lucidlint.json"]
ignore = ["standard"]  # the acknowledged-debt list is data the gate feeds on, not source


[lucidlint."tests/**"]
ignore = ["fakefs"]

[lucidlint."tests/pipeline/**"]
ignore = ["fakefs"]

[lucidlint."tests/document/**"]
ignore = ["fakefs"]

[lucidlint."tools/gedcom_document.py"]
ignore = ["god-class"]

# latent-class: the band-size sweep's locals carry the run's state — no class for one call site (recorded 2026-10-08, held not split)
[lucidlint."pipeline/evals/eval_band_size.py"]
ignore = ["god-class"]

# fakefs: the exporter tests use a real SQLite file and a real archive tree on
# tmp_path — the append-only store, sqlite semantics and the versioned file
# chain are the subject, not incidental I/O (docs/testing-standards.md).
[lucidlint."tests/live/**"]
ignore = ["fakefs"]
