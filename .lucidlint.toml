[lucidlint."pipeline/evals/eval_geometry.py"]
ignore = ["unused"]
[lucidlint."pipeline/evals/eval_review.py"]
ignore = ["unused"]
[lucidlint."pipeline/evals/spike_vlm_contract.py"]
ignore = ["unused"]
[lucidlint."pipeline/evals/walk_review.py"]
ignore = ["unused"]
[lucidlint."tools/text.py"]
ignore = ["unused"]
[lucidlint."tools/box.py"]
