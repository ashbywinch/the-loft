name: AI Code Review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
# One review at a time per PR; a newer push cancels the stale run rather than
# queueing behind it (dependabot bumps and rapid fix pushes never stack).
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  pr-review:
    runs-on: ubuntu-latest
    # Dependency bumps are mechanical — don't spend review capacity on them.
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read # the fail-loud check reads the bot's own log for the failure reason
    steps:
      - uses: actions/checkout@v7
      - uses: the-pr-agent/pr-agent@v0.41.1 # pin a real release tag — @latest does not resolve
        id: pr-agent
        env:
          OPENAI_KEY: ${{ secrets.OPENCODE_GO_THE_LOFT_API_KEY }}
          OPENAI_BASE_URL: https://opencode.ai/zen/go/v1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # SECURITY + correctness: the config comes from this pinned branch,
          # never the PR head (a same-repo branch could ship its own
          # api_base/config and exfiltrate the key) — mirrors omp-config.
          PR_AGENT_CONFIG_BRANCH: pr-agent-config
      # TEMPORARY diagnostic (2026-09-05): fingerprint the CI credential
      # and probe the gateway from CI, so the CI-vs-local 401 discrepancy
      # is grounded in evidence (never prints the key itself).
      - name: Gateway auth diagnostic
        env:
          GW_KEY: ${{ secrets.OPENAI_API_KEY }}
          GW_URL: ${{ secrets.OPENAI_BASE_URL }}
        run: |
          python3 -c "
          import json, os, urllib.request, urllib.error
          key = os.environ['GW_KEY']
          print(f'::notice::credential len={len(key)} suffix=...{key[-4:]} prefix={key[:5]}')
          url = os.environ.get('GW_URL', '').rstrip('/') + '/chat/completions'
          print(f'::notice::probe url={url}')
          body = json.dumps({'model': 'dynamic/fallback2', 'messages': [{'role': 'user', 'content': 'say ok'}], 'max_tokens': 5}).encode()
          req = urllib.request.Request(url, data=body, headers={'Authorization': f'Bearer {key}', 'Content-Type': 'application/json', 'User-Agent': 'opencode/1.14.20'})
          try:
              r = urllib.request.urlopen(req, timeout=60)
              print(f'::notice::probe HTTP {r.status}')
          except urllib.error.HTTPError as e:
              print(f'::error::probe HTTP {e.code} {e.read().decode(chr(117)+chr(116)+chr(102)+chr(45)+chr(56), chr(114)+chr(101)+chr(112)+chr(108)+chr(97)+chr(99)+chr(101))[:120]}')
          "
      # Fail loud: a silently-failed review reads as a green check. The check
      # matches "## PR Reviewer Guide" comments (the review never contains the
      # head SHA — v0.41.1 posts it without the marker) or one posted after
      # the head commit landed.
      - name: Fail loud if no review covers the head commit
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/check_review_posted.py
